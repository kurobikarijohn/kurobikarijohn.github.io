<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パラメータ獲得シミュレーター</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; background-color: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .config-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #fafafa; padding: 10px; border-radius: 5px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #333; color: white; }
        .is-sp { background-color: #fff9db; }
        .val-main { font-weight: bold; color: #e74c3c; }
        .total-row { background: #333; color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>パラメータ獲得シミュレーター</h2>

    <div class="config-section">
        <div class="form-group">
            <label>アイテム加算上限</label>
            <select id="limit" onchange="calculate()">
                <option value="90">90</option>
                <option value="80">80</option>
                <option value="70">70</option>
            </select>
        </div>
        <div class="form-group"><label>Voボーナス(%)</label><input type="number" id="bVo" value="12.5" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>Daボーナス(%)</label><input type="number" id="bDa" value="12.5" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>Viボーナス(%)</label><input type="number" id="bVi" value="12.5" step="0.1" oninput="calculate()"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>週/SP</th>
                <th>メイン</th>
                <th>Vo</th>
                <th>Da</th>
                <th>Vi</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="2">合計獲得</td>
                <td id="tVo">0</td><td id="tDa">0</td><td id="tVi">0</td>
            </tr>
        </tfoot>
    </table>
</div>

<script>
    const data = [
        { w: 4,  sp: { m: 140, s: 55 }, n: { m: 110, s: 50 } },
        { w: 7,  sp: { m: 180, s: 60 }, n: { m: 144, s: 53 } },
        { w: 12, sp: { m: 260, s: 70 }, n: { m: 214, s: 58 } },
        { w: 14, sp: { m: 370, s: 90 }, n: { m: 320, s: 75 } },
        { w: 16, sp: { m: 570, s: 115 }, n: { m: 504, s: 108 } }
    ];

    const tbody = document.getElementById('table-body');
    data.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.id = `row-${i}`;
        tr.innerHTML = `
            <td>${item.w}w <input type="checkbox" id="sp-${i}" checked onchange="calculate()"></td>
            <td><select id="type-${i}" onchange="calculate()"><option value="Vo">Vo</option><option value="Da">Da</option><option value="Vi">Vi</option></select></td>
            <td id="v-${i}-Vo">0</td><td id="v-${i}-Da">0</td><td id="v-${i}-Vi">0</td>
        `;
        tbody.appendChild(tr);
    });

    function calculate() {
        const limit = parseInt(document.getElementById('limit').value);
        const penalty = (limit === 90) ? 0 : (limit === 80 ? 10/3 : 20/3);
        const bonus = {
            Vo: parseFloat(document.getElementById('bVo').value || 0) / 100,
            Da: parseFloat(document.getElementById('bDa').value || 0) / 100,
            Vi: parseFloat(document.getElementById('bVi').value || 0) / 100
        };

        let total = { Vo: 0, Da: 0, Vi: 0 };

        data.forEach((item, i) => {
            const isSP = document.getElementById(`sp-${i}`).checked;
            const main = document.getElementById(`type-${i}`).value;
            const base = isSP ? item.sp : item.n;
            document.getElementById(`row-${i}`).className = isSP ? 'is-sp' : '';

            ['Vo', 'Da', 'Vi'].forEach(type => {
                const isM = (type === main);
                const final = Math.round(((isM ? base.m : base.s) - penalty) * (1 + bonus[type]));
                const cell = document.getElementById(`v-${i}-${type}`);
                cell.innerText = final;
                cell.className = isM ? 'val-main' : '';
                total[type] += final;
            });
        });

        document.getElementById('tVo').innerText = total.Vo;
        document.getElementById('tDa').innerText = total.Da;
        document.getElementById('tVi').innerText = total.Vi;
    }
    calculate();
</script>
</body>
</html>
